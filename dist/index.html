<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TAKI Sales Lab — môi trường luyện tư vấn khóa học với khách hàng mô phỏng." />
  <title>TAKI Sales Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Về trang chủ">
        <span class="brand-mark">T</span>
        <span><strong>TAKI</strong><small>Sales Lab</small></span>
      </button>
      <div class="top-actions">
        <button class="ghost-button" data-action="history">Lịch sử <span id="historyCount" class="count">0</span></button>
        <div class="avatar" aria-label="Tài khoản demo">CT</div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
